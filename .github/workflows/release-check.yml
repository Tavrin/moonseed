name: Release validation (never publishes)

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 0'

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: 8
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  MOONSEED_RELEASE_RESULTS: ${{ github.workspace }}/results/release-check

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install validation tools
        run: |
          python3 tools/ci_run.py -- rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          python3 tools/ci_run.py -- rustup toolchain install 1.88 --profile minimal
          python3 tools/ci_run.py -- sudo apt-get update
          python3 tools/ci_run.py -- sudo apt-get install -y bubblewrap build-essential curl
          python3 tools/ci_run.py --runtime -- bwrap --die-with-parent --ro-bind / / -- /bin/true
      - name: Build hash-verified PUC Lua 5.4.9 (without LUA_COMPAT_5_3)
        run: |
          bash tools/build_lua54.sh "$RUNNER_TEMP/lua54"
          echo "MOONSEED_LUA54=$RUNNER_TEMP/lua54/lua-5.4.9/src/lua" >> "$GITHUB_ENV"
          echo "MOONSEED_LUA54_UD=$RUNNER_TEMP/lua54/lua54-userdata" >> "$GITHUB_ENV"
      - name: Full release gate from a fresh local HEAD clone
        run: |
          python3 tools/ci_run.py --seconds 120 -- git clone --no-local "$GITHUB_WORKSPACE" "$RUNNER_TEMP/moonseed-clean"
          cd "$RUNNER_TEMP/moonseed-clean"
          test ! -e .cache
          test ! -e vendor
          test -z "$(git status --porcelain)"
          bash tools/release_check.sh
      - name: Retain validation receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-validation
          path: results/release-check/
          retention-days: 14
