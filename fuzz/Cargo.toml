[package]
name = "moonseed-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
description = "libFuzzer targets for Moonseed (cargo-fuzz); never published."

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
moonseed = { path = "../crates/moonseed" }

# Its own workspace: the root workspace's members list does not include it,
# so `cargo build --workspace` at the root never builds the fuzz targets.
[workspace]
members = ["."]

[profile.release]
debug = 1

[lib]
path = "src/lib.rs"
test = false
doc = false

[[bin]]
name = "compile"
path = "fuzz_targets/compile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compile_run"
path = "fuzz_targets/compile_run.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chunk_load"
path = "fuzz_targets/chunk_load.rs"
test = false
doc = false
bench = false

[[bin]]
name = "snapshot_restore"
path = "fuzz_targets/snapshot_restore.rs"
test = false
doc = false
bench = false

[[bin]]
